<style>

<div id="stage"><canvas id="cv"></canvas><button id="sl" aria-label="Scroll left">◀</button><button id="sr" aria-label="Scroll right">▶</button><button id="su" aria-label="Scroll up">▲</button><button id="sd" aria-label="Scroll down">▼</button><button id="zi" aria-label="Zoom in">+</button><button id="zo" aria-label="Zoom out">−</button><div id="note"></div><div id="hint">Pick a material and draw.<br>Pinch or scroll to zoom, drag with two fingers to move.</div></div>

<script>
const E=0,SAND=1,DIRT=2,SEED=3,WATER=4,OIL=5,WAX=6,PLANT=7,FIRE=8,GRASS=9,EGG=10,CRE=11,CB=12,KA=13,KB=14,EGG2=15,WOOD=16,LEAF=17,TIP=18,METAL=19,CLOUD=20,WICK=27,PLANK=28,LAD=29,STORE=30,GREN=31;
const BASE={1:[224,190,108],2:[110,74,46],3:[168,150,70],4:[48,118,226],5:[74,52,36],6:[246,232,188],7:[58,162,72],8:[255,140,30],9:[92,196,62],10:[250,222,228],11:[240,110,160],12:[150,90,225],13:[170,80,115],14:[104,64,170],15:[196,170,240],16:[104,70,40],17:[48,150,58],18:[150,210,90],19:[132,142,160],20:[240,244,250],21:[28,96,60],22:[240,150,192],23:[228,128,38],24:[228,52,70],25:[252,214,50],26:[172,92,222],27:[196,164,112],28:[240,206,110],29:[196,142,78],30:[226,84,64],31:[58,62,58]};
const VAR={1:.12,2:.15,3:.3,4:.05,5:.3,6:.04,7:.18,8:.5,9:.2,10:.06,11:.12,12:.12,13:.12,14:.12,15:.06,16:.12,17:.22,18:.1,19:.18,20:.05,21:.2,22:.12,23:.2,24:.1,25:.1,26:.1,27:.12,28:.1,29:.12,30:.3,31:.1};
const pack=(r,g,b)=>(255<<24)|(b<<16)|(g<<8)|r,cl=v=>Math.max(0,Math.min(255,v|0));
const PAL=[];for(const t in BASE){PAL[t]=new Uint32Array(32);for(let s=0;s<32;s++){const k=1+(s-16)/16*VAR[t],c=BASE[t];PAL[t][s]=pack(cl(c[0]*k),cl(c[1]*k),cl(c[2]*k))}}
const BG=pack(11,15,20),WSURF=pack(140,195,255);
const DAYLEN=6000;let clk=1800,OPEN=null;   // clk: ticks since the start; one day lasts DAYLEN ticks and the game starts in the morning
const light=()=>Math.max(0,Math.min(1,.5+.65*Math.sin((clk%DAYLEN)/DAYLEN*6.2832-1.5708)));   // 0 = night, 1 = noon
const isNight=()=>light()<.25;
const dimc=(c,k)=>(255<<24)|(((c>>16&255)*k)<<16&16711680)|(((c>>8&255)*k)<<8&65280)|((c&255)*k&255);
const MATS=[[SAND,'Sand'],[DIRT,'Dirt'],[SEED,'Seeds'],[WATER,'Water'],[OIL,'Oil'],[WAX,'Wax'],[METAL,'Metal'],[WICK,'Wick'],[FIRE,'Lighter'],[EGG,'Pink eggs'],[EGG2,'Purple eggs'],[CLOUD,'Cloud'],[WOOD,'Wood'],[PLANK,'Plank'],[LEAF,'Leaves'],[GRASS,'Grass'],[PLANT,'Plant'],[LAD,'Ladder'],[STORE,'Food store'],[CRE,'Pink creature'],[CB,'Purple creature'],[-1,'Eraser']];
const R=Math.random;
const NONE=-2,ST={stored:0,rooms:0,cut:0,sealed:0,tunnels:0,domes:0,wound:0,plant:0,old:0,healed:0,towers:0,floors:0,hatch:0,grown:0,eggs:0,drown:0,burn:0,fight:0,bomb:0,ufo:0,starve:0,doused:0,rocketsBuilt:0,launched:0,arrived:0,metal:0,shots:0,shotHits:0,drones:0,droneBombs:0},FL={seal:1,build:1,ladder:0,pantry:1,press:1,storey:0,gren:1,war:1,plant:1,dig:1,jump:1,flee:1,share:1,breed:1,drown:1,mine:1,gun:1,drone:1,rocket:1},TU0={bpct:15,agg:1,cloudAlt:14,ufoAlt:8,bolt:.0003,old:300,maxf:8,act:.12,fight:1,gw:40,ww:60,drown:.012,lay:.8,hatch:.06,gren:.2,starve:.00004},TU={...TU0},FL0={...FL};let speed=1,dbgOn=false,insp=null,ov={war:false,tgt:false};
const CH=new Float32Array(32),LF=new Uint8Array(32);   // flammability: chance per tick to catch fire, and how long the flame lasts
[[OIL,.35,22],[WAX,.015,40],[PLANT,.12,18],[GRASS,.15,14],[SEED,.05,10],[EGG,.02,10],[CRE,.3,10],[CB,.3,10],[KA,.35,10],[KB,.35,10],[EGG2,.02,10],[WOOD,.05,28],[LEAF,.12,10],[TIP,.1,10],[21,.12,10],[22,.12,10],[23,.14,10],[24,.1,8],[25,.1,8],[26,.1,8],[WICK,.06,10],[PLANK,.07,34],[LAD,.08,26],[STORE,.08,10]].forEach(([t,c,l])=>{CH[t]=c;LF[t]=l});
let scv=0,camAuto=true;   // until the player scrolls or pans, the view stays centred on the middle of the map, whatever happens to the window size
let T,S,A,HI,AG,HU,WT,SD,AN,AC,BK,RK,ID,NM,GN,idc=0,mv,W=0,H=0,VW=0,camX=0,sc=0,CSZ=4,VHr=0,zlv=innerWidth<640?1:2,rainOn=false,dirty=0,pop=[0,0],cnt=[0,0],CAP=50000,clouds=[],ZL=[2,3,4,6,8,12],ZMIN=2,ZMAX=16,vy=0,fx=0,zs=0,img,buf,f=0,sel=SAND,brush=4,paused=false,ptr=null,last=null;
zs=ZL[zlv];
const note=document.getElementById('note');
const tick=document.createElement('div');tick.id='ticker';document.getElementById('stage').appendChild(tick);
const envEl=document.createElement('div');envEl.id='env';document.getElementById('stage').appendChild(envEl);
const folBtn=document.createElement('button');folBtn.id='fol';folBtn.textContent='🎥';folBtn.setAttribute('aria-label','Follow camera');document.getElementById('stage').appendChild(folBtn);folBtn.onclick=()=>setFollow((follow+1)%4,true);
function setFollow(m,msg){follow=m;folBtn.textContent=['🎥','👑','👑','🔍'][m];folBtn.style.background=['#000a','#c0407a','#7a50c8','#3a7a50'][m];if(msg)logEv(['🎥 Follow camera off','🎥 Following the Pink leader','🎥 Following the Purple leader','🎥 Following the selected creature (Move / none, then tap one)'][m])}
function followStep(){if(!follow)return;let ti=-1;if(follow<3){const k=LDPOS[follow-1];if(k>=0&&isC(T[k])&&RK[k]&128)ti=k}else if(insp&&!insp.lost)ti=insp.i;if(ti<0)return;const tg=Math.max(0,Math.min(W-VW,ti%W-(VW>>1))),d=tg-camX;camAuto=false;camX+=Math.abs(d)<2?d:Math.round(d*.07);{const sh=stage.clientHeight,tv=H*CSZ-sh*.5-(ti/W|0)*CSZ;vy+=(tv-vy)*.07}}   // also keep the followed creature in view when zoomed in tall
const TN=['<b style="color:#f06ea0">Pink</b>','<b style="color:#b98af0">Purple</b>'];
function logEv(msg){const d=document.createElement('div');d.innerHTML=msg;tick.appendChild(d);while(tick.children.length>5)tick.firstChild.remove();setTimeout(()=>{d.style.opacity=0;setTimeout(()=>d.remove(),900)},9000)}   // event ticker: the last few things that happened, fading after a few seconds
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),stage=document.getElementById('stage'),bar=document.getElementById('bar'),hint=document.getElementById('hint'),tally=document.createElement('div');tally.id='tally';stage.appendChild(tally);
for(const ev of ['pointerdown','click','keydown','wheel','touchstart'])document.addEventListener(ev,()=>{hint.style.opacity='0'},{capture:true,passive:true});   // the introductory hint goes away as soon as the player touches anything: draws, pans, zooms, scrolls, presses a key or a button // dismiss the introductory hint after any click anywhere in the game

// ---- grid
function resize(){
  const r=stage.getBoundingClientRect(),cs=zs,vw=Math.max(32,Math.ceil(r.width/cs)+1),nh0=Math.max(H,260,r.height/cs|0),nh=T&&nh0>H?Math.ceil(nh0/32)*32:nh0,nw0=Math.max(W,Math.min(1500,Math.max(vw*3,600))),nw=T&&nw0>W?Math.min(1500,Math.ceil(nw0/100)*100):nw0;   // the world is ~3 screens wide
  VHr=Math.ceil(r.height/cs);
  if(nw===W&&nh===H&&vw===VW&&cs===CSZ)return;
  if(T&&nw===W&&nh===H){   // only the view changed (zoom or window size): keep the whole world as it is and just resize the picture, so pinching stays smooth
    VW=Math.min(vw,W);CSZ=cs;if(camAuto)camX=Math.max(0,(W-VW)>>1);else camX=Math.max(0,Math.min(camX,W-VW));
    cv.width=VW;cv.height=H;cv.style.width=VW*cs+'px';cv.style.height=H*cs+'px';img=new ImageData(VW,H);buf=new Uint32Array(img.data.buffer);applyCam();return}
  const nT=new Uint8Array(nw*nh),nS=new Uint8Array(nw*nh),nA=new Uint8Array(nw*nh),nG=new Uint16Array(nw*nh),nU=new Uint8Array(nw*nh),nWT=new Uint8Array(nw*nh),nSD=new Uint8Array(nw*nh),nRK=new Uint8Array(nw*nh),nID=new Uint16Array(nw*nh),nNM=new Uint16Array(nw*nh),nGN=new Uint32Array(nw*nh);
  const dxs=T?(nw-W)>>1:0;   // a wider world grows evenly on both sides, so whatever is in the middle stays in the middle
  if(T){const dy=nh-H;for(let y=0;y<H;y++){const ny=y+dy;if(ny<0||ny>=nh)continue;for(let x=0;x<Math.min(W,nw);x++){const a=y*W+x,b=ny*nw+x+dxs;nT[b]=T[a];nS[b]=S[a];nA[b]=A[a];nG[b]=AG[a];nU[b]=HU[a];nWT[b]=WT[a];nSD[b]=SD[a];nRK[b]=RK[a];nID[b]=ID[a];nNM[b]=NM[a];nGN[b]=GN[a]}}}
  const hadT=!!T,dyS=hadT?nh-H:0,oW=W,oHI=hadT?HI:null,oT=hadT?T:null;
  T=nT;S=nS;A=nA;AG=nG;HU=nU;WT=nWT;SD=nSD;HI=new Int32Array(nw*nh);AN=new Int32Array(nw*nh);AC=new Int16Array(nw*nh);BK=new Uint8Array(nw*nh);RK=nRK;ID=nID;NM=nNM;GN=nGN;mv=new Uint8Array(nw*nh);W=nw;H=nh;wildReset();
  if(hadT){   // the ground moved down by dyS rows: carry everything that remembers a row (dens, rooms, clouds, UFOs) down with it, so zooming never disturbs the world
    for(let y=0;y<nh-dyS;y++)for(let x=0;x<Math.min(oW,nw);x++){const o=y*oW+x,c=oT[o];if(c>=11&&c<=14&&oHI[o]){const h=oHI[o],hy=(h/oW|0)+dyS,hx=h%oW+dxs;if(hy>=0&&hy<nh&&hx<nw)HI[(y+dyS)*nw+x+dxs]=hy*nw+hx}}
    for(const m of TW)for(const t of m){t.gb+=dyS;t.x+=dxs}for(const c of clouds)c.x+=dxs;for(const o of ufos)o.x+=dxs;for(const m of FEAR)for(const e of m)e.x+=dxs;
    SKY+=dyS;tallY+=dyS;for(const c of clouds)if(c.y!==undefined)c.y+=dyS;for(const o of ufos){o.y+=dyS;if(o.by!==undefined)o.by+=dyS}
    seen[0]=seen[1]=-1;alarm[0]=alarm[1]=-1;
    if(nw>oW){const ter=new Set([DIRT,SAND,GRASS,PLANT,WATER,OIL,WAX]);   // extend the ground on both sides (mirrored copies of the old terrain) so it runs the whole length of the map
      for(let x=0;x<nw;x++){if(x>=dxs&&x<dxs+oW)continue;const k=x<dxs?dxs-1-x:x-dxs-oW,m=k%(2*oW),mm=m<oW?m:2*oW-1-m,sx=x<dxs?dxs+mm:dxs+oW-1-mm;for(let y=0;y<nh;y++){const c=T[y*nw+sx];if(ter.has(c)){T[y*nw+x]=c;S[y*nw+x]=S[y*nw+sx];A[y*nw+x]=c===PLANT||c===GRASS?A[y*nw+sx]:0}}}}}
  VW=Math.min(vw,W);CSZ=cs;camX=Math.min(camX,W-VW);
  if(camAuto)camX=Math.max(0,(W-VW)>>1);else camX=Math.max(0,Math.min(camX,W-VW));
  cv.width=VW;cv.height=H;cv.style.width=VW*cs+'px';cv.style.height=H*cs+'px';
  img=new ImageData(VW,H);buf=new Uint32Array(img.data.buffer);applyCam();
}
// ---- camera: camX is the whole cell at the left edge, fx the extra fraction of a cell, vy how many screen pixels the view is lifted above the ground
function applyCam(){const sw=stage.clientWidth,sh=stage.clientHeight,wv=sw/CSZ;camX=Math.max(0,Math.min(W-VW,camX));fx=Math.max(0,Math.min(fx,VW-wv,W-camX-wv));vy=Math.max(0,Math.min(Math.max(0,H*CSZ-sh),vy));cv.style.left=(-fx*CSZ)+'px';cv.style.bottom=(-vy)+'px'}
function setCamX(f){const wv=stage.clientWidth/CSZ;f=Math.max(0,Math.min(W-wv,f));camX=Math.max(0,Math.min(W-VW,Math.floor(f)));fx=Math.max(0,f-camX)}
function zoomTo(z,cx,cy){   // zoom so that the point under (cx,cy) on screen stays exactly where it is
  z=Math.max(ZMIN,Math.min(ZMAX,Math.round(z*20)/20));if(z===zs)return;camAuto=false;
  const r=stage.getBoundingClientRect(),px=cx-r.left,py=cy-r.top,sh=r.height,u=camX+fx+px/CSZ,row=(py-(sh+vy-H*CSZ))/CSZ,oW=W,oH=H;
  zs=z;resize();
  const du=(W-oW)>>1,dr=H-oH;   // a world that grew was shifted: carry the focus point along with it
  setCamX(u+du-px/CSZ);vy=py-(row+dr)*CSZ-sh+H*CSZ;applyCam()}
function sw(i,j){if(!T[i]){RK[i]=0;ID[i]=0;NM[i]=0;GN[i]=0}if(!T[j]){RK[j]=0;ID[j]=0;NM[j]=0;GN[j]=0}let v=RK[i];RK[i]=RK[j];RK[j]=v;v=ID[i];ID[i]=ID[j];ID[j]=v;v=NM[i];NM[i]=NM[j];NM[j]=v;v=GN[i];GN[i]=GN[j];GN[j]=v;v=T[i];T[i]=T[j];T[j]=v;v=S[i];S[i]=S[j];S[j]=v;v=A[i];A[i]=A[j];A[j]=v;v=HI[i];HI[i]=HI[j];HI[j]=v;v=AG[i];AG[i]=AG[j];AG[j]=v;v=HU[i];HU[i]=HU[j];HU[j]=v;v=WT[i];WT[i]=WT[j];WT[j]=v;v=SD[i];SD[i]=SD[j];SD[j]=v;v=AN[i];AN[i]=AN[j];AN[j]=v;v=AC[i];AC[i]=AC[j];AC[j]=v;v=BK[i];BK[i]=BK[j];BK[j]=v;mv[i]=mv[j]=f}
const put=(i,t,a)=>{T[i]=t;S[i]=R()*32|0;A[i]=a||0;HI[i]=0;AG[i]=0;HU[i]=0;WT[i]=0;SD[i]=0;AN[i]=0;AC[i]=0;BK[i]=0;RK[i]=0;NM[i]=0;const cr=t>=11&&t<=14;ID[i]=cr?newId():0;GN[i]=cr?(R()*4294967296)>>>0:0;mv[i]=f};

// ---- lineages, pair bonds and life stories: every creature (and egg) keeps one id and a 32-bit genome (GN) all its life; a record per id holds its family, mate and a short diary
const LIFE=new Map();let bondLog=-9999,griefLog=-9999;
const newId=()=>{idc=idc%65535+1;LIFE.delete(idc);return idc};
const getRec=id=>{if(!id)return null;let r=LIFE.get(id);if(!r){r={n:id,b:clk,pa:0,pb:0,fam:id,gen:0,kids:0,ev:[],mate:0,mi:0,mx:0,gf:0,dead:0};LIFE.set(id,r)}return r};
const life=(id,txt)=>{const r=getRec(id);if(!r)return;const e=r.ev,l=e[e.length-1];if(l&&l[1]===txt){l[2]++;return}e.push([clk,txt,1]);if(e.length>12)e.splice(1,1)};
const evo=(i,t,a)=>{const d=ID[i],g=GN[i],o=T[i];put(i,t,a);if(d){ID[i]=d;GN[i]=g;life(d,o===EGG||o===EGG2?'hatched':'grew up')}};   // egg -> baby -> adult: same id, same genome
const mourning=i=>{const r=LIFE.get(ID[i]);return !!r&&r.gf>0};

  if(e.shiftKey&&!e.ctrlKey){setCamX(camX+fx+(e.deltaY||e.deltaX)*k/CSZ);applyCam();return}   // shift + wheel: scroll sideways
  if(e.altKey&&!e.ctrlKey){vy-=e.deltaY*k;applyCam();return}   // alt + wheel: scroll up / down
  zoomTo(zs*Math.exp(-Math.max(-120,Math.min(120,e.deltaY*k))*(e.ctrlKey?.01:.0018)),e.clientX,e.clientY)},{passive:false});   // wheel or trackpad pinch: zoom at the cursor

addEventListener('keydown',e=>{if(e.key==='+'||e.key==='=')zoom(1);else if(e.key==='-')zoom(-1)});
// ---- scrolling: hold the on-screen arrows (or the arrow keys)
for(const [id,d] of [['su',1],['sd',-1]]){const b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();scv=d;b.setPointerCapture(e.pointerId)});for(const ev of['pointerup','pointercancel'])b.addEventListener(ev,()=>{scv=0})}
for(const [id,d] of [['sl',-1],['sr',1]]){const b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();sc=d;b.setPointerCapture(e.pointerId)});for(const ev of['pointerup','pointercancel'])b.addEventListener(ev,()=>{sc=0})}
addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowLeft')sc=-1;if(e.key==='ArrowRight')sc=1;if(e.key==='ArrowUp'){scv=1;e.preventDefault()}if(e.key==='ArrowDown'){scv=-1;e.preventDefault()}});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight')sc=0;if(e.key==='ArrowUp'||e.key==='ArrowDown')scv=0});
// ---- off-screen notices for clouds and UFOs
function notify(){   // an icon pinned to the screen edge, sliding along it to follow each off-screen cloud or UFO
  const sw=stage.clientWidth,sh=stage.clientHeight,cxv=camX+fx+sw/CSZ/2,top=H-(sh+vy)/CSZ,items=[];
  const at=(ic,x,y)=>{let dx=((x-cxv)%W+W)%W;if(dx>W/2)dx-=W;const px=sw/2+dx*CSZ,py=(y-top)*CSZ;
    if(px>=0&&px<=sw&&py>=0&&py<=sh)return;const m=py<60?76:24;items.push([ic,Math.max(m,Math.min(sw-m,px)),Math.max(24,Math.min(sh-24,py))])};   // keep clear of the corner buttons
  if(rainOn)for(const c of clouds)if(c.rain)at('☁️',c.x,cBase(c)-c.h/2);
  for(const o of ufos)at('🛸',o.x,o.y);
  while(note.children.length>items.length)note.lastChild.remove();
  while(note.children.length<items.length)note.appendChild(document.createElement('i'));
  items.forEach(([ic,px,py],n)=>{const e=note.children[n];if(e.textContent!==ic)e.textContent=ic;e.style.left=px+'px';e.style.top=py+'px'})}
// ---- go
resize();camX=Math.max(0,(W-VW)>>1);let started=false;const begin=()=>{if(!started){started=true;war()}};   // the opening war mode is built once the page layout has settled, so it is identical to pressing the War mode button
new ResizeObserver(()=>{resize();if(!started)setTimeout(begin,60)}).observe(stage);setTimeout(begin,400);
for(let k=0;k<4;k++){addCloud(W*(k+.5)/4,3+R()*8,R()<.5);clouds[k].t=100+R()*500}
let fr=0;(function loop(){if(!(fr++%40)){updSky();maintain()}if(ptr){const p=pos(ptr);stamp(p.x,p.y)}if(sc){camAuto=false;if(follow)setFollow(0);camX=Math.max(0,Math.min(W-VW,camX+sc*3))}if(scv){camAuto=false;if(follow)setFollow(0);vy+=scv*10}applyCam();const t0=performance.now();if(!paused)for(let s=0;s<speed;s++){weather();step();if(dirty>0&&f%6===0){dirty--;support()}}const t1=performance.now();followStep();draw();notify();if(dbgOn)dbgFrame(t1-t0,performance.now()-t1);requestAnimationFrame(loop)})();
</script>
<script>
(function(){
const NM={1:'Sand',2:'Dirt',3:'Seed',4:'Water',5:'Oil',6:'Wax',7:'Plant',8:'Fire',9:'Grass',10:'Pink egg',11:'Pink adult',12:'Purple adult',13:'Pink baby',14:'Purple baby',15:'Purple egg',16:'Wood',17:'Leaf',18:'Tree tip',20:'Cloud',21:'Leaf B',22:'Leaf C',23:'Leaf D',24:'Flower R',25:'Flower Y',26:'Flower P',27:'Wick',28:'Plank',29:'Ladder',30:'Food store',31:'Grenade'};
const $=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const mb=$('button','','☰');mb.id='mb';mb.type='button';mb.setAttribute('aria-label','Menu');stage.appendChild(mb);
const menu=$('div');menu.id='menu';menu.hidden=true;stage.appendChild(menu);
const dbg=$('div');dbg.id='dbg';dbg.hidden=true;stage.appendChild(dbg);
mb.onclick=()=>{menu.hidden=!menu.hidden;mp.textContent=paused?'Resume':'Pause'};
const dl=$('label','ck','<input type="checkbox"> Debug mode');menu.appendChild(dl);
dl.firstChild.onchange=e=>{dbgOn=e.target.checked;dbg.hidden=!dbgOn;if(dbgOn)refresh()};
const sl=$('label','','Sim speed <b>1×</b><input type="range" min="1" max="5" value="1">');menu.appendChild(sl);
sl.querySelector('input').oninput=e=>{speed=+e.target.value;sl.querySelector('b').textContent=speed+'×'};
const mp=$('button','','Pause');mp.type='button';mp.onclick=()=>{pb.click();mp.textContent=paused?'Resume':'Pause'};menu.appendChild(mp);
menu.appendChild($('small','','Tip: pick “Move / none” to drag the camera with one finger and pinch to zoom. With debug on, tap a creature with it to inspect.'));
// ---- debug panel
const SC={};
function sec(k,title,open){const d=$('details');d.open=!!open;d.appendChild($('summary','',title));const b=$('div','b');d.appendChild(b);dbg.appendChild(d);SC[k]={d,b};return b}
const pre=k=>{const p=$('pre');SC[k].b.appendChild(p);return p};
sec('ab','Creature abilities (toggle)',true);sec('tune','Tuning: weather, ageing & creatures (live)',true);sec('act','Actions & overlays',true);
sec('sim','Simulation & performance (text)',true);sec('wx','Weather, UFOs, war (text)');sec('mat','Materials (cell counts)');sec('pop','Creatures: population & events',true);sec('insp','Creature inspector',true);sec('idea','Ideas to make creatures more interesting');
const pSim=pre('sim');
const pWx=pre('wx');
const pMat=pre('mat');
const pPop=pre('pop');const hc=$('canvas');hc.width=300;hc.height=50;hc.style.cssText='width:100%;height:50px;image-rendering:auto;position:static;cursor:default;background:#0003;border-radius:6px';SC.pop.b.appendChild(hc);
const FLS=[['seal','Seal paths with blocks when threatened'],['build','Build towers, domes, tunnels & treehouses'],['ladder','Lay ladders'],['pantry','Stock food pantries'],['press','Press food into oil'],['storey','Add second storeys'],['gren','Throw grenades'],['war','Colonies arm warriors'],['plant','Plant seeds'],['dig','Dig / tunnel'],['jump','Jump & cling'],['flee','Flee fire'],['share','Share food & oil'],['breed','Lay eggs'],['drown','Drowning is deadly'],['mine','Warriors mine buried metal'],['gun','Warriors shoot guns (needs metal)'],['drone','Build attack drones (needs metal)'],['rocket','Build rockets and fly to space (needs metal)']];
for(const [k,n] of FLS){const l=$('label','ck','<input type="checkbox"'+(FL[k]?' checked':'')+'> '+n);l.firstChild.onchange=e=>FL[k]=e.target.checked?1:0;SC.ab.b.appendChild(l)}
const TS=[['agg','Aggression ×',0,3,.1],['bpct','Extra % of colony devoted to breeding',0,100,1],['cloudAlt','Cloud margin above tallest 10% of terrain (cells)',0,120,1],['ufoAlt','UFO margin above the same line (cells)',0,120,1],['bolt','Lightning rate (rare)',0,.003,.0001],['old','Age when creatures become elderly',30,1200,10],['maxf','Max tower floors',1,12,1],['act','Action rate (per tick)',.02,.5,.01],['fight','Fight lethality ×',0,4,.1],['gw','Grudge needed to arm',5,100,1],['ww','Crowding needed to arm',10,100,1],['drown','Drown rate',0,.1,.002],['lay','Egg-laying chance',0,1,.05],['hatch','Den hatch rate',0,.5,.01],['gren','Grenade throw chance',0,1,.05],['starve','Baby starve rate',0,.002,.00002],['cap','Population cap / colony',100,200000,100]];
const sync=[];
for(const [k,n,lo,hi,st] of TS){const l=$('label','',n+' <b></b><input type="range" min="'+lo+'" max="'+hi+'" step="'+st+'">'),r=l.querySelector('input'),b=l.querySelector('b');
  const get=()=>k==='cap'?CAP:TU[k],upd=()=>{r.value=get();b.textContent=+(+get()).toPrecision(3)};
  r.oninput=e=>{if(k==='cap')CAP=+e.target.value;else TU[k]=+e.target.value;upd()};upd();sync.push(upd);SC.tune.b.appendChild(l)}
const rs=$('button','','Reset tuning & abilities');rs.type='button';rs.onclick=()=>{Object.assign(TU,TU0);CAP=50000;sync.forEach(f=>f());Object.assign(FL,FL0);SC.ab.b.querySelectorAll('input').forEach((i,n)=>i.checked=!!FL[FLS[n][0]])};SC.tune.b.appendChild(rs);
SC.insp.b.appendChild($('small','','Pick “Move / none”, then tap a creature. It is tracked as it moves.'));
const pIn=pre('insp');const row=$('div','row');SC.insp.b.appendChild(row);
const bt=(t,f)=>{const b=$('button','',t);b.type='button';b.onclick=f;row.appendChild(b);return b};
const eachAd=f=>{for(let i=0;i<W*H;i++){const t=T[i];if(t===CRE||t===CB)f(i)}};
bt('Feed',()=>{if(insp&&isC(T[insp.i])&&T[insp.i]<13)A[insp.i]=A[insp.i]&~6|6});bt('Arm',()=>{if(insp&&T[insp.i]<13)A[insp.i]|=32});bt('Kill',()=>{if(insp){T[insp.i]=0;insp=null}});
const row2=$('div','row');SC.act.b.appendChild(row2);for(const [t,fn] of [['Arm all',()=>eachAd(i=>A[i]|=32)],['Disarm all',()=>eachAd(i=>A[i]&=~32)],['Hurt all',()=>eachAd(i=>HU[i]=1)],['Age all',()=>eachAd(i=>AG[i]=TU.old+1)]]){const b=$('button','',t);b.type='button';b.onclick=fn;row2.appendChild(b)}
for(const [k,n] of [['war','Mark warriors'],['tgt','Show targets / alarms']]){const l=$('label','ck','<input type="checkbox"> '+n);l.firstChild.onchange=e=>ov[k]=e.target.checked;SC.act.b.appendChild(l)}
SC.idea.b.appendChild($('pre','',`Not in the sim yet (each could get its own counters here):
• Age & lifespan (store in S bits), so colonies turn over
• Hunger meter instead of instant eating; starvation for adults
• Roles: builder, farmer, scout, medic, guard
• Day/night: sleep in dens, watch fires at night
• Pheromone trails to food and to enemies
• Memory of food spots and dangerous spots
• Fear & morale: low morale makes warriors retreat
• Healing: carry the wounded home (HP instead of one-hit kills)
• Farming: replant seeds near the den, water crops
• Bridges/boats across water; fishing
• Banners marking territory; truce and trade when grudge is 0
• Leaders that rally warriors; a queen that lays eggs
• Pets: tame a rare third creature
Useful extra telemetry: time-to-first-den, den count, avg distance to den, kills per warrior, tree height per colony.`));
// ---- data
let fps=0,lt=performance.now(),sm=0,dm=0,n=0;const hist=[[],[]];
function track(){if(!insp)return;if(T[insp.i]===insp.t){insp.lost=0;return}
  const x0=insp.i%W,y0=insp.i/W|0;let b=-1,bd=99;
  for(let dy=-5;dy<=5;dy++)for(let dx=-5;dx<=5;dx++){const x=x0+dx,y=y0+dy;if(x<0||x>=W||y<0||y>=H)continue;const j=y*W+x;if(T[j]===insp.t&&dx*dx+dy*dy<bd){bd=dx*dx+dy*dy;b=j}}
  if(b>=0){insp.i=b;insp.lost=0}else insp.lost=1}
window.inspectAt=p=>{let b=null,bd=99;for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const x=p.x+dx,y=p.y+dy;if(x<0||x>=W||y<0||y>=H)continue;const i=y*W+x,t=T[i];if(t>=10&&t<=15&&dx*dx+dy*dy<bd){bd=dx*dx+dy*dy;b=i}}insp=b==null?null:{i:b,t:T[b],lost:0};refresh()};
window.dbgFrame=(a,b)=>{const t=performance.now();fps=fps*.9+1000/Math.max(1,t-lt)*.1;lt=t;sm=sm*.9+a*.1;dm=dm*.9+b*.1;track();if(++n%12===0)refresh()};
function refresh(){
  const cnt={},C=[0,1].map(()=>({ad:0,war:0,baby:0,egg:0,den:0,food:0,oil:0,wet:0,air:0}));let tot=0;
  for(let i=0,N=W*H;i<N;i++){const t=T[i];if(!t)continue;tot++;cnt[t&31]=(cnt[t&31]||0)+1;
    if(t>=10&&t<=15){const c=C[raceOf(t)],a=A[i];if(t===CRE||t===CB){c.ad++;if(a>>5&1)c.war++;c.food+=a>>1&3;c.oil+=a>>3&3;if(HI[i])c.den++;if(a>>6)c.wet++;if(T[i+W]===0)c.air++}else if(t===KA||t===KB)c.baby++;else c.egg++}}
  if(SC.sim.d.open)pSim.textContent=`grid ${W}×${H}  view ${VW}  cam x ${camX}\ncell ${CSZ}px (zoom ${zs.toFixed(2)})  frame ${f}\nfps ${fps.toFixed(0)}  sim ${sm.toFixed(1)}ms  draw ${dm.toFixed(1)}ms\nfilled ${tot} (${(100*tot/(W*H)).toFixed(1)}%)  speed ${speed}×  ${paused?'PAUSED':'running'}\nbrush ${brush}  tool ${sel===NONE?'move':sel<0?'eraser':NM[sel]||sel}`;
  if(SC.wx.d.open)pWx.textContent=`rain ${rainOn}  storm ${storm}  war mode ${warOn}  metal ${MET[0]}/${MET[1]}  rockets ${ROCK[0].length+ROCK[1].length} (flying ${FLY.length})  in space ${SPACE[0]}/${SPACE[1]}  drones ${drn.length}  bullets ${bul.length}\nclouds ${clouds.length} (${clouds.filter(c=>c.rain).length} raining)  bolt ${bolt?'yes':'no'}\nufos ${ufos.length}`+ufos.map(o=>`\n · ${o.r?'purple':'pink'} ${o.help?'helper':'raider'} x${o.x|0} time left ${o.t}`).join('');
  if(SC.mat.d.open)pMat.textContent=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).map(([k,v])=>(NM[k]||k).padEnd(13)+v).join('\n');
  const nm=["Pink","Purple"];
  hist[0].push(pop[0]);hist[1].push(pop[1]);if(hist[0].length>300){hist[0].shift();hist[1].shift()}
  if(SC.pop.d.open){pPop.textContent=[0,1].map(r=>{const c=C[r];return `${nm[r]}: pop ${pop[r]}/${CAP}  adults ${c.ad} (${c.war} warriors)\n  babies ${c.baby}  eggs ${c.egg}  with den ${c.den}/${c.ad}\n  food carried ${c.food}  oil ${c.oil}  swimming ${c.wet}  airborne ${c.air}\n  want ${want[r]}  grudge ${grudge[r]}  alarm ${alarm[r]}  seen ${seen[r]}\n  AGGRESSION ${agg[r].toFixed(0)}/100  army ${wp[r]}  (losses ${losses[r].toFixed(1)}, hunger ${hungry[r].toFixed(1)}, births ${bth[r].toFixed(1)})`}).join('\n')+`\nEvents: eggs laid ${ST.eggs}  hatched ${ST.hatch}  grown ${ST.grown}\n  killed: fights ${ST.fight}  grenades ${ST.bomb}  ufo ${ST.ufo}  burned ${ST.burn}  drowned ${ST.drown}  starved ${ST.starve}\nCare: planted ${ST.plant}  wounded ${ST.wound}  healed ${ST.healed}  died of old age ${ST.old}\nRooms ${ST.rooms}  trees cut ${ST.cut}  floors ${ST.floors}  domes ${ST.domes}  tunnels ${ST.tunnels}  paths sealed ${ST.sealed}\nStructures: planks ${cnt[28]||0}  ladders ${cnt[29]||0}  stores ${cnt[30]||0}  grenades ${cnt[31]||0}  oil ${cnt[5]||0}`;
    const g=hc.getContext('2d'),mx=Math.max(10,...hist[0],...hist[1]);g.clearRect(0,0,300,50);
    [[0,'#f06ea0'],[1,'#9a5ae1']].forEach(([r,c])=>{g.strokeStyle=c;g.beginPath();hist[r].forEach((v,i)=>{const x=i,y=48-46*v/mx;i?g.lineTo(x,y):g.moveTo(x,y)});g.stroke()})}
  if(SC.insp.d.open){if(!insp)pIn.textContent='nothing selected';else{const i=insp.i,t=insp.t,a=A[i],x=i%W,y=i/W|0,h=HI[i],ad=t===CRE||t===CB,hx=h%W,hy=h/W|0;
    pIn.textContent=`${NM[t]}${ad?' “'+nameOf(i)+'”':''}${insp.lost?'  (LOST)':''}${ad&&RK[i]&128?'  👑 LEADER':''}${ad&&(RK[i]&127)>=3?'  ★ champion':''}${ad?'\nkills '+(RK[i]&127)+'  temper '+TEMPER[(gene(i)>>>8)%4]+(NM[i]?'  nemesis '+nameId(NM[i]):''):''}\npos ${x},${y}  A=${a} (bin ${a.toString(2).padStart(8,'0')})`+(ad?`\nfacing ${a&1?'right':'left'}  food ${a>>1&3}/3  oil ${a>>3&3}/3\nage ${AG[i]}${AG[i]>TU.old?' (ELDER)':''}  ${HU[i]?'HURT':'healthy'}\nrole ${a>>5&1?'WARRIOR':'worker'}  breath used ${a>>6}/3\nden ${h?hx+','+hy+'  dist '+(Math.abs(hx-x)+Math.abs(hy-y)):'none (homeless)'}\npioneer-type ${S[i]%5===0?'yes':'no'}`:t===KA||t===KB?`\nmeals ${a}/2  den ${h?hx+','+hy:'none'}`:`\nin-den egg ${a===1}`)+lifeText(i)}}
}
const mk=(x,y,c)=>{x-=camX;if(x>=0&&x<VW&&y>=0&&y<H)buf[y*VW+x]=c};
window.dbgDraw=()=>{
  if(ov.war)for(let y=0;y<H;y++)for(let x=camX;x<camX+VW;x++){const i=y*W+x,t=T[i];if((t===CRE||t===CB)&&A[i]&32)mk(x,y-3,pack(255,40,40))}
  if(ov.tgt){for(let r=0;r<2;r++){const c=r?pack(150,90,225):pack(240,110,160);for(const q of [seen[r],alarm[r]]){if(q<0)continue;const x=q%W,y=q/W|0;for(let d=-3;d<=3;d++){mk(x+d,y,c);mk(x,y+d,c)}}}}
  if(insp&&!insp.lost){const x=insp.i%W,y=insp.i/W|0,c=pack(255,240,60);for(let d=-5;d<=5;d++){mk(x+d,y-6,c);mk(x+d,y+5,c);mk(x-5,y+d-.5|0,c);mk(x+5,y+d-.5|0,c)}
    const h=HI[insp.i];if(h&&(insp.t===CRE||insp.t===CB)){const hx=h%W,hy=h/W|0,k=Math.max(Math.abs(hx-x),Math.abs(hy-y),1);for(let s=0;s<=k;s+=3)mk(Math.round(x+(hx-x)*s/k),Math.round(y+(hy-y)*s/k),pack(120,255,160))}}
};
})();
</script>
